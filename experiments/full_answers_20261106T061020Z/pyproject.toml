[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "canadianness-llm-evals"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "PyYAML>=6"]
[project.optional-dependencies]
inference = ["vllm==0.17.0", "transformers==4.57.6"]
test = ["pytest>=8", "Jinja2>=3"]
[project.scripts]
llm-evals = "llm_evals.__main__:main"
[tool.pytest.ini_options]
pythonpath = ["src"]
